<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewCrown👑</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="escaparate">
        <div class="tarjeta">
            <div class="oferta">Oferta!!</div>
            <div class="tarjeta__img"></div>
            <div class="tarjeta__nombre"><h2>Life Lived</h2></div>
            <div class="tarjeta__precio">
                <span class="tarjeta__precio--anterior">$1,200 MXN</span>
                <span class="tarjeta__precio--actual">$900 MXN</span>
            </div>
            <div class="tarjeta__descripcion"><p>Cada segundo vivido deja una marca que hacemos visible a traves de "Life Lived"</p></div>
            <button type="submit" class="tarjeta__boton">Comprar</button>
        </div>
    </section>
</body>
</html>
